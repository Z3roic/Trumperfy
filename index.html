<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>trumpify</title>
<style>
  :root {
    --page: #181818;
    --bar: #131313;
    --line: #262626;
    --line-hi: #3a3a3a;
    --ink: #e4e4e4;
    --dim: #8c8c8c;
    --btn: #252525;
    --btn-hi: #303030;
    --accent: #7db4ff;
    --danger: #ff8f7a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--page); color: var(--ink);
    font: 14px/1.4 Ubuntu, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }

  header { background: var(--bar); border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; }
  .sep { width: 1px; height: 20px; background: var(--line-hi); margin: 0 4px; }
  .lbl { color: var(--dim); }
  .check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; padding: 0 4px; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  button, select {
    font: inherit; color: var(--ink); background: var(--btn);
    border: 1px solid var(--line-hi); border-radius: 4px; height: 30px; padding: 0 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  select { padding: 0 8px; }
  button:hover:not(:disabled), select:hover { background: var(--btn-hi); border-color: #4a4a4a; }
  button:active:not(:disabled) { background: #1d1d1d; }
  button:disabled { color: #5f5f5f; border-color: var(--line); background: #1d1d1d; cursor: default; }
  button.primary { background: #1f2c3f; border-color: #3d6ba6; color: #d6e8ff; }
  button.primary:hover:not(:disabled) { background: #26374f; border-color: var(--accent); }
  button.icon { display: inline-grid; place-items: center; padding: 0; width: 32px; }
  button.icon svg { width: 15px; height: 15px; }
  button[aria-expanded="true"] { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .progress { height: 3px; }
  .progress i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform .12s linear; }

  #stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; position: relative; }
  #view {
    width: min(100cqw, 100cqh); height: min(100cqw, 100cqh);
    display: block; background: #141414;
  }

  footer { background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 8px 14px; min-height: 40px; }
  #scrub { flex: 0 1 560px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #scrub:disabled { cursor: default; opacity: .4; }
  #status { color: var(--dim); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.error { color: var(--danger); white-space: normal; }

  #panel {
    position: absolute; top: calc(100% + 6px); right: 10px; width: min(300px, calc(100vw - 20px));
    background: #1e1e1e; border: 1px solid #383838; border-radius: 6px; padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.55); display: grid; gap: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .row > span { color: var(--dim); }
  .row output { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .row small { grid-column: 1 / -1; color: var(--dim); font-size: 12px; }

  @media (max-width: 720px) { .sep { display: none; } footer { flex-direction: column; align-items: stretch; gap: 4px; } #scrub { flex-basis: auto; } }
  @media (prefers-reduced-motion: reduce) { .progress i, button, select { transition: none; } }
</style>
</head>
<body>

<header>
  <div class="tools" role="toolbar" aria-label="Transformation controls">
    <button id="play" disabled>play transformation</button>
    <label class="check"><input type="checkbox" id="reverse"> reverse</label>
    <span class="sep" aria-hidden="true"></span>
    <button id="gif" disabled>save gif</button>
    <span class="sep" aria-hidden="true"></span>
    <label class="lbl" for="preset">choose preset:</label>
    <select id="preset"></select>
    <span class="sep" aria-hidden="true"></span>
    <button id="newsrc" class="primary">trumpify new image</button>
    <button id="edit" class="icon" aria-label="Settings" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.25.25 0 0 0-.064.108l-.558 1.953 1.953-.558a.25.25 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>
    </button>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <section id="panel" hidden aria-label="Settings">
    <label class="row"><span>Detail</span>
      <select id="detail">
        <option value="64">64 × 64</option>
        <option value="96">96 × 96</option>
        <option value="128">128 × 128</option>
        <option value="160">160 × 160</option>
      </select></label>
    <label class="row"><span>Keep pixels close</span><output id="o-near"></output>
      <input type="range" id="near" min="0" max="100" step="1" value="60">
      <small>Higher means shorter trips, but a less exact match.</small></label>
    <label class="row"><span>Duration</span><output id="o-dur"></output>
      <input type="range" id="dur" min="1" max="15" step="0.1" value="9"></label>
  </section>
</header>

<main id="stage">
  <canvas id="view" aria-label="Pixel mosaic"></canvas>
</main>

<footer>
  <input type="range" id="scrub" min="0" max="1000" step="1" value="0" disabled aria-label="Transformation progress">
  <span id="status" role="status" aria-live="polite"></span>
</footer>

<input type="file" id="srcfile" accept="image/*" hidden>

<script id="core">
const Core = (() => {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeSolver(src, tgt, N, lam, seed, opts) {
    opts = opts || {};
    const M = N * N;
    const sr = new Int16Array(M), sg = new Int16Array(M), sb = new Int16Array(M);
    const tr = new Int16Array(M), tg = new Int16Array(M), tb = new Int16Array(M);
    const sl = new Float32Array(M), tl = new Float32Array(M);
    const px = new Int16Array(M), py = new Int16Array(M);
    for (let i = 0; i < M; i++) {
      const o = i * 4;
      sr[i] = src[o]; sg[i] = src[o + 1]; sb[i] = src[o + 2];
      tr[i] = tgt[o]; tg[i] = tgt[o + 1]; tb[i] = tgt[o + 2];
      sl[i] = 0.299 * sr[i] + 0.587 * sg[i] + 0.114 * sb[i];
      tl[i] = 0.299 * tr[i] + 0.587 * tg[i] + 0.114 * tb[i];
      px[i] = i % N; py[i] = (i / N) | 0;
    }
    const so = Int32Array.from({ length: M }, (_, i) => i).sort((a, b) => sl[a] - sl[b]);
    const order = Int32Array.from({ length: M }, (_, i) => i).sort((a, b) => tl[a] - tl[b]);
    const perm = new Int32Array(M);
    if (opts.init === 'rank') for (let k = 0; k < M; k++) perm[order[k]] = so[k];
    else for (let i = 0; i < M; i++) perm[i] = i;

    let rng = ((seed || 0x9e3779b9) >>> 0) || 1;
    const next = () => {
      rng ^= rng << 13; rng ^= rng >>> 17; rng ^= rng << 5; rng >>>= 0;
      return rng;
    };
    const SPAN = Math.max(8, (M / 40) | 0);
    const R = Math.max(3, (N / 10) | 0);

    function cost(t, s) {
      const dr = sr[s] - tr[t], dg = sg[s] - tg[t], db = sb[s] - tb[t];
      const dx = px[s] - px[t], dy = py[s] - py[t];
      return 2 * dr * dr + 4 * dg * dg + 3 * db * db + lam * (dx * dx + dy * dy);
    }

    function run(n, T) {
      for (let i = 0; i < n; i++) {
        let t1, t2;
        const mode = i % 3;
        if (mode === 0) {
          t1 = next() % M; t2 = next() % M;
        } else if (mode === 1) {
          const a = next() % M;
          let b = a + ((next() % (2 * SPAN + 1)) - SPAN);
          if (b < 0) b = 0; else if (b >= M) b = M - 1;
          t1 = order[a]; t2 = order[b];
        } else {
          t1 = next() % M;
          const x = px[t1] + ((next() % (2 * R + 1)) - R), y = py[t1] + ((next() % (2 * R + 1)) - R);
          if (x < 0 || y < 0 || x >= N || y >= N) continue;
          t2 = y * N + x;
        }
        if (t1 === t2) continue;
        const s1 = perm[t1], s2 = perm[t2];
        const before = cost(t1, s1) + cost(t2, s2);
        const after = cost(t1, s2) + cost(t2, s1);
        if (after - before < T) { perm[t1] = s2; perm[t2] = s1; }
      }
    }

    function energy() {
      let e = 0;
      for (let t = 0; t < M; t++) e += cost(t, perm[t]);
      return e / M;
    }
    return { perm, run, energy, M };
  }

  function medianCut(rgb, count, maxColors) {
    let boxes = [Array.from({ length: count }, (_, i) => i)];
    const range = (box) => {
      let r0 = 255, r1 = 0, g0 = 255, g1 = 0, b0 = 255, b1 = 0;
      for (const i of box) {
        const r = rgb[i * 3], g = rgb[i * 3 + 1], b = rgb[i * 3 + 2];
        if (r < r0) r0 = r; if (r > r1) r1 = r;
        if (g < g0) g0 = g; if (g > g1) g1 = g;
        if (b < b0) b0 = b; if (b > b1) b1 = b;
      }
      const dr = r1 - r0, dg = g1 - g0, db = b1 - b0;
      const m = Math.max(dr, dg, db);
      return { m, ch: m === dr ? 0 : m === dg ? 1 : 2 };
    };
    let info = boxes.map(range);
    while (boxes.length < maxColors) {
      let best = -1, score = 0;
      for (let i = 0; i < boxes.length; i++) {
        if (boxes[i].length < 2) continue;
        const s = info[i].m * Math.sqrt(boxes[i].length);
        if (s > score) { score = s; best = i; }
      }
      if (best < 0 || score === 0) break;
      const box = boxes[best], ch = info[best].ch;
      box.sort((a, b) => rgb[a * 3 + ch] - rgb[b * 3 + ch]);
      const mid = box.length >> 1;
      const a = box.slice(0, mid), b = box.slice(mid);
      boxes[best] = a; info[best] = range(a);
      boxes.push(b); info.push(range(b));
    }
    return boxes.map((box) => {
      let r = 0, g = 0, b = 0;
      for (const i of box) { r += rgb[i * 3]; g += rgb[i * 3 + 1]; b += rgb[i * 3 + 2]; }
      const n = box.length || 1;
      return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    });
  }

  function buildLut(palette) {
    const lut = new Uint8Array(32768);
    for (let c = 0; c < 32768; c++) {
      const r = ((c >> 10) << 3) | 4, g = (((c >> 5) & 31) << 3) | 4, b = ((c & 31) << 3) | 4;
      let best = 0, bd = Infinity;
      for (let i = 0; i < palette.length; i++) {
        const p = palette[i];
        const d = 2 * (p[0] - r) ** 2 + 4 * (p[1] - g) ** 2 + 3 * (p[2] - b) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
      lut[c] = best;
    }
    return lut;
  }

  function encodeGif(w, h, palette, frames, delays) {
    let buf = new Uint8Array(1 << 20), len = 0;
    const put = (b) => {
      if (len === buf.length) { const n = new Uint8Array(buf.length * 2); n.set(buf); buf = n; }
      buf[len++] = b;
    };
    const u16 = (v) => { put(v & 255); put(v >> 8); };
    const str = (s) => { for (let i = 0; i < s.length; i++) put(s.charCodeAt(i)); };

    str('GIF89a'); u16(w); u16(h);
    put(0xF7); put(0); put(0);
    for (let i = 0; i < 256; i++) {
      const p = palette[i] || [0, 0, 0];
      put(p[0]); put(p[1]); put(p[2]);
    }
    put(0x21); put(0xFF); put(0x0B); str('NETSCAPE2.0'); put(3); put(1); u16(0); put(0);

    const tab = new Int32Array(1 << 20);
    const lzwBytes = [];
    for (let f = 0; f < frames.length; f++) {
      put(0x21); put(0xF9); put(4); put(0x04); u16(delays[f]); put(0); put(0);
      put(0x2C); u16(0); u16(0); u16(w); u16(h); put(0);
      put(8);

      lzwBytes.length = 0;
      const idx = frames[f];
      const CLEAR = 256, EOI = 257;
      let size = 9, nextCode = 258, cur = 0, shift = 0;
      const emit = (code) => {
        cur |= code << shift; shift += size;
        while (shift >= 8) { lzwBytes.push(cur & 255); cur >>>= 8; shift -= 8; }
      };
      tab.fill(-1);
      emit(CLEAR);
      let prefix = idx[0];
      for (let i = 1; i < idx.length; i++) {
        const k = idx[i], key = (prefix << 8) | k, c = tab[key];
        if (c !== -1) { prefix = c; continue; }
        emit(prefix);
        if (nextCode === 4096) {
          emit(CLEAR); tab.fill(-1); nextCode = 258; size = 9;
        } else {
          if (nextCode >= (1 << size)) size++;
          tab[key] = nextCode++;
        }
        prefix = k;
      }
      emit(prefix);
      if (size < 12 && nextCode >= (1 << size)) size++;
      emit(EOI);
      if (shift > 0) lzwBytes.push(cur & 255);

      for (let i = 0; i < lzwBytes.length; i += 255) {
        const n = Math.min(255, lzwBytes.length - i);
        put(n);
        for (let j = 0; j < n; j++) put(lzwBytes[i + j]);
      }
      put(0);
    }
    put(0x3B);
    return buf.slice(0, len);
  }

  function colorGain(src, tgt, N) {
    const M = N * N;
    const sl = new Float32Array(M), tl = new Float32Array(M);
    for (let i = 0; i < M; i++) {
      const o = i * 4;
      sl[i] = 0.299 * src[o] + 0.587 * src[o + 1] + 0.114 * src[o + 2];
      tl[i] = 0.299 * tgt[o] + 0.587 * tgt[o + 1] + 0.114 * tgt[o + 2];
    }
    const so = Int32Array.from({ length: M }, (_, i) => i).sort((a, b) => sl[a] - sl[b]);
    const to = Int32Array.from({ length: M }, (_, i) => i).sort((a, b) => tl[a] - tl[b]);
    const cost = (s, t) => {
      const dr = src[s * 4] - tgt[t * 4], dg = src[s * 4 + 1] - tgt[t * 4 + 1], db = src[s * 4 + 2] - tgt[t * 4 + 2];
      return 2 * dr * dr + 4 * dg * dg + 3 * db * db;
    };
    let stay = 0, rank = 0;
    for (let i = 0; i < M; i++) stay += cost(i, i);
    for (let k = 0; k < M; k++) rank += cost(so[k], to[k]);
    return (stay - rank) / M;
  }

  return { mulberry32, makeSolver, medianCut, buildLut, encodeGif, colorGain };
})();
</script>

    const g = out.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingQuality = 'high';
    g.drawImage(cv, 0, 0, n, n);
    return g.getImageData(0, 0, n, n).data;
  }
  const sample = (img, n, zoom = 1, px = 0, py = 0) => shrinkTo(cropSquare(img, 1024, zoom, px, py), n);

  const PRESETS = {
    sunset(g, S, rnd) {
      const sky = g.createLinearGradient(0, 0, 0, S);
      [[0, '#1b2246'], [.22, '#4f3a7c'], [.45, '#c9527f'], [.66, '#f28f5a'], [.84, '#ffd39a'], [1, '#fff0cf']]
        .forEach(([o, c]) => sky.addColorStop(o, c));
      g.fillStyle = sky; g.fillRect(0, 0, S, S);
      for (let i = 0; i < 60; i++) {
        g.fillStyle = `rgba(255,240,220,${0.3 + rnd() * 0.6})`;
        g.fillRect(rnd() * S, rnd() * S * 0.4, 1.5, 1.5);
      }
      const sun = g.createRadialGradient(S * .5, S * .78, 4, S * .5, S * .78, S * .3);
      sun.addColorStop(0, '#fff8dc'); sun.addColorStop(.35, '#ffcf86'); sun.addColorStop(1, 'rgba(255,150,100,0)');
      g.fillStyle = sun; g.fillRect(0, 0, S, S);
      [['#7a3f5a', .74, .09], ['#3d2447', .82, .07], ['#1a1226', .91, .05]].forEach(([c, y, a], layer) => {
        g.fillStyle = c; g.beginPath(); g.moveTo(0, S);
        for (let x = 0; x <= S; x += 4) g.lineTo(x, S * y + Math.sin(x * 0.025 + layer * 2) * S * a * .5 + Math.sin(x * 0.07 + layer) * S * a * .25);
        g.lineTo(S, S); g.fill();
      });
    },
    confetti(g, S, rnd) {
      g.fillStyle = '#231d33'; g.fillRect(0, 0, S, S);
      const pal = ['#ff4d6d', '#ff9f43', '#ffd166', '#f6e7cf', '#f4b38f', '#8c5a3c', '#3fb8af', '#4d7cfe', '#9b5de5', '#2d2a3e', '#fff'];
      for (let i = 0; i < 1400; i++) {
        g.fillStyle = pal[(rnd() * pal.length) | 0];
        const r = 2 + rnd() * 9;
        g.globalAlpha = .55 + rnd() * .45;
        if (rnd() < .5) { g.beginPath(); g.arc(rnd() * S, rnd() * S, r, 0, 7); g.fill(); }
        else { g.save(); g.translate(rnd() * S, rnd() * S); g.rotate(rnd() * 6.3); g.fillRect(-r, -r / 3, r * 2, r * .66); g.restore(); }
      }
      g.globalAlpha = 1;
    },
    ocean(g, S) {
      const sea = g.createLinearGradient(0, 0, 0, S);
      [[0, '#031019'], [.3, '#0a3d5e'], [.6, '#2b8fa8'], [.85, '#a9dcd2'], [1, '#f3f1df']].forEach(([o, c]) => sea.addColorStop(o, c));
      g.fillStyle = sea; g.fillRect(0, 0, S, S);
      for (let i = 0; i < 46; i++) {
        const y0 = (i / 46) * S;
        g.strokeStyle = `rgba(230,250,245,${0.05 + 0.2 * (i / 46)})`;
        g.lineWidth = 1 + i / 20;
        g.beginPath();
        for (let x = 0; x <= S; x += 3) g.lineTo(x, y0 + Math.sin(x * 0.04 + i * .7) * 5 + Math.sin(x * .013 + i) * 8);
        g.stroke();
      }
    },
    forest(g, S, rnd) {
      const sky = g.createLinearGradient(0, 0, 0, S);
      [[0, '#dfe9b8'], [.45, '#b4cf7c'], [1, '#5c8f3d']].forEach(([o, c]) => sky.addColorStop(o, c));
      g.fillStyle = sky; g.fillRect(0, 0, S, S);
      ['#7fa552', '#4f8039', '#2c5a2a', '#153a1e', '#08200f'].forEach((c, l) => {
        g.fillStyle = c;
        const base = S * (.42 + l * .12), n = 10 + l * 5;
        for (let i = 0; i < n; i++) {
          const x = rnd() * S, w = 22 + rnd() * 26 + l * 6, h = 60 + rnd() * 70 + l * 14;
          g.beginPath(); g.moveTo(x - w / 2, base + h * .4); g.lineTo(x, base - h * .6); g.lineTo(x + w / 2, base + h * .4); g.fill();
        }
        g.fillRect(0, base + S * .08, S, S);
      });
    },
    neon(g, S) {
      const id = g.createImageData(S, S);
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const u = x / S * 6.3, v = y / S * 6.3;
        const p = Math.sin(u * 1.2 + Math.sin(v)) + Math.sin(v * 1.3 + Math.sin(u * .8)) + Math.sin(Math.hypot(u - 3.1, v - 3.1) * 1.6);
        const h = (p * 60 + 300) % 360, l = 22 + 30 * (Math.sin(p * 2.2) * .5 + .5);
        const [r, gg, b] = hsl(h, .9, l / 100);
        const o = (y * S + x) * 4;
        id.data[o] = r; id.data[o + 1] = gg; id.data[o + 2] = b; id.data[o + 3] = 255;
      }
      g.putImageData(id, 0, 0);
    },
  };
  function hsl(h, s, l) {
    const a = s * Math.min(l, 1 - l);
    const f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [f(0) * 255 | 0, f(8) * 255 | 0, f(4) * 255 | 0];
  }
  const presetCache = {};
  async function getPreset(name) {
    if (presetCache[name]) return presetCache[name];
    if (name === 'wisetree') return (presetCache[name] = await loadImage(WISETREE));
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    PRESETS[name](cv.getContext('2d'), S, Core.mulberry32(name.length * 7919 + 13));
    return (presetCache[name] = cv);
  }

  const SPRING = 9;
  const SPRING_END = 1 - (1 + SPRING) * Math.exp(-SPRING);
  function ease(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return (1 - (1 + SPRING * t) * Math.exp(-SPRING * t)) / SPRING_END;
  }

  function prepareView(n, srcPixels) {
    N = n; M = n * n; K = Math.max(2, Math.round(512 / n)); W = N * K;
    el.view.width = el.view.height = W;
    imgData = ctx.createImageData(W, W);
    buf32 = new Uint32Array(imgData.data.buffer);
    sx = new Int16Array(M); sy = new Int16Array(M); tx = new Int16Array(M); ty = new Int16Array(M);
    color32 = new Uint32Array(M); fin32 = new Uint32Array(M);
    posX = new Float32Array(M); posY = new Float32Array(M);
    cellOf = new Int32Array(M); starts = new Int32Array(M + 1); cursor = new Int32Array(M); items = new Int32Array(M);
    for (let i = 0; i < M; i++) {
      sx[i] = i % N; sy[i] = (i / N) | 0; tx[i] = sx[i]; ty[i] = sy[i];
      const o = i * 4;
      color32[i] = fin32[i] = ((255 << 24) | (srcPixels[o + 2] << 16) | (srcPixels[o + 1] << 8) | srcPixels[o]) >>> 0;
    }
  }
  function applyPerm(perm) {
    for (let t = 0; t < M; t++) {
      const s = perm[t];
      tx[s] = t % N; ty[s] = (t / N) | 0;
      fin32[t] = color32[s];
    }
  }

  function fillBlocks(colors, k, out, size) {
    for (let t = 0; t < M; t++) {
      const c = colors[t], X = (t % N) * k, Y = ((t / N) | 0) * k;
      for (let yy = Y; yy < Y + k; yy++) {
        const row = yy * size;
        for (let xx = X; xx < X + k; xx++) out[row + xx] = c;
      }
    }
  }

  let wBest = 0, wColor = 0;
  function scanCell(xx, yy, gx, gy) {
    if (xx < 0 || yy < 0 || xx >= N || yy >= N) return;
    const c = yy * N + xx;
    for (let j = starts[c], e = starts[c + 1]; j < e; j++) {
      const s = items[j], dx = posX[s] - gx, dy = posY[s] - gy, d = dx * dx + dy * dy;
      if (d < wBest) { wBest = d; wColor = color32[s]; }
    }
  }
  function widen(gx, gy, cx, cy, best, color) {
    wBest = best; wColor = color;
    for (let r = 2; r < N; r++) {
      if (wBest <= (r - 1) * (r - 1)) break;
      for (let xx = cx - r; xx <= cx + r; xx++) { scanCell(xx, cy - r, gx, gy); scanCell(xx, cy + r, gx, gy); }
      for (let yy = cy - r + 1; yy <= cy + r - 1; yy++) { scanCell(cx - r, yy, gx, gy); scanCell(cx + r, yy, gx, gy); }
    }
    return wColor;
  }

  const candX = new Float32Array(4096), candY = new Float32Array(4096), candC = new Uint32Array(4096);

  function render(e, k, out, size) {
    if (e <= 0) return fillBlocks(color32, k, out, size);
    if (e >= 1) return fillBlocks(fin32, k, out, size);

    starts.fill(0);
    for (let s = 0; s < M; s++) {
      const x = sx[s] + (tx[s] - sx[s]) * e + 0.5, y = sy[s] + (ty[s] - sy[s]) * e + 0.5;
      posX[s] = x; posY[s] = y;
      let cx = x | 0, cy = y | 0;
      if (cx >= N) cx = N - 1;
      if (cy >= N) cy = N - 1;
      const c = cy * N + cx;
      cellOf[s] = c; starts[c + 1]++;
    }
    for (let i = 0; i < M; i++) starts[i + 1] += starts[i];
    cursor.set(starts.subarray(0, M));
    for (let s = 0; s < M; s++) items[cursor[cellOf[s]]++] = s;

    const inv = 1 / k;
    for (let cy = 0; cy < N; cy++) {
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < N - 1 ? cy + 1 : N - 1;
      for (let cx = 0; cx < N; cx++) {
        const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < N - 1 ? cx + 1 : N - 1;
        let n = 0;
        for (let yy = y0; yy <= y1; yy++) {
          const b1 = starts[yy * N + x1 + 1];
          for (let j = starts[yy * N + x0]; j < b1 && n < 4096; j++) {
            const s = items[j];
            candX[n] = posX[s]; candY[n] = posY[s]; candC[n++] = color32[s];
          }
        }
        for (let j2 = 0; j2 < k; j2++) {
          const gy = cy + (j2 + 0.5) * inv, row = (cy * k + j2) * size + cx * k;
          for (let i2 = 0; i2 < k; i2++) {
            const gx = cx + (i2 + 0.5) * inv;
            let best = 1e9, bc = 0;
            for (let j = 0; j < n; j++) {
              const dx = candX[j] - gx, dy = candY[j] - gy, d = dx * dx + dy * dy;
              if (d < best) { best = d; bc = candC[j]; }
            }
            if (best > 1.44) bc = widen(gx, gy, cx, cy, best, bc);
            out[row + i2] = bc;
          }
        }
      }
    }
  }
  function draw(e) {
    state.progress = e;
    render(e, K, buf32, W);
    ctx.putImageData(imgData, 0, 0);
    el.scrub.value = Math.round(e * 1000);
  }
  function cancelAnim() { if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; } }
  function play() {
    if (!state.ready || state.busy) return;
    cancelAnim();
    const rev = el.reverse.checked, t0 = performance.now(), dur = settings.dur * 1000;
    const frame = (now) => {
      const u = Math.min(1, (now - t0) / dur);
      draw(ease(rev ? 1 - u : u));
      state.raf = u < 1 ? requestAnimationFrame(frame) : 0;
    };
    state.raf = requestAnimationFrame(frame);
  }

  const PASSES = 900;

  function solveAsync(src, tgt, id) {

    const gain = Math.max(Core.colorGain(src, tgt, N), 2000);
    const lam = 9.377 * Math.pow(settings.near / 100, 2) * gain / M;
    const solver = Core.makeSolver(src, tgt, N, lam, undefined, { init: 'identity' });
    const total = M * PASSES;
    let done = 0;
    return new Promise((resolve) => {
      (function step() {
        if (id !== state.solveId) return resolve(null);
        const t0 = performance.now();
        while (done < total && performance.now() - t0 < 14) {
          const n = Math.min(40000, total - done);
          solver.run(n, 260 * Math.max(0, 1 - done / total / 0.7));
          done += n;
        }
        setProgress(done / total);
        setStatus(`matching pixels ${Math.round((done / total) * 100)}%`);
        applyPerm(solver.perm);
        draw(1);
        if (done < total) setTimeout(step, 0); else resolve(solver.perm);
      })();
    });
  }

  async function rebuild() {
    const id = ++state.solveId;
    cancelAnim();
    state.ready = false; state.busy = false;
    refreshButtons(); setProgress(0);

    if (!state.srcImg) return;
    const n = settings.detail;
    let srcPx;
    try { srcPx = sample(state.srcImg, n); }
    catch (e) { setStatus('Could not read that image.', 'error'); return; }
    prepareView(n, srcPx);
    draw(0);

    let tgtPx;
    try { tgtPx = sample(state.tgtImg, n, TARGET_VIEW.zoom, TARGET_VIEW.panx, TARGET_VIEW.pany); }
    catch (e) {
      setStatus(location.protocol === 'file:'
        ? 'Browsers block reading files from disk. Open this page from a web server (your GitHub Pages site).'
        : 'Could not read the target photo.', 'error');
      return;
    }

    state.busy = true; refreshButtons();
    await tick();
    const perm = await solveAsync(srcPx, tgtPx, id);
    if (perm === null || id !== state.solveId) return;

    applyPerm(perm);
    state.busy = false; state.ready = true;
    refreshButtons(); setProgress(0); setStatus('');
    draw(el.reverse.checked ? 1 : 0);
    if (reducedMotion) draw(1); else play();
  }
  let rebuildTimer = 0;
  const scheduleRebuild = () => { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 220); };

  async function saveGif() {
    if (!state.ready || state.busy) return;
    state.busy = true; refreshButtons(); cancelAnim();
    try {
      const gk = Math.max(2, Math.round(384 / N)), size = N * gk, FRAMES = 96;
      const rgb = new Uint8Array(M * 3);
      for (let i = 0; i < M; i++) {
        const c = color32[i];
        rgb[i * 3] = c & 255; rgb[i * 3 + 1] = (c >> 8) & 255; rgb[i * 3 + 2] = (c >> 16) & 255;
      }
      setStatus('building palette');
      await tick();
      const palette = Core.medianCut(rgb, M, 256);
      while (palette.length < 256) palette.push([0, 0, 0]);
      const lut = Core.buildLut(palette);

      const out = new Uint32Array(size * size);
      const frames = [], delays = [];
      const perFrame = Math.max(3, Math.round((settings.dur * 100) / FRAMES));
      const rev = el.reverse.checked;
      for (let f = 0; f < FRAMES; f++) {
        const u = f / (FRAMES - 1);
        render(ease(rev ? 1 - u : u), gk, out, size);
        const idx = new Uint8Array(size * size);
        for (let i = 0; i < idx.length; i++) {
          const c = out[i];
          idx[i] = lut[(((c & 255) >> 3) << 10) | ((((c >> 8) & 255) >> 3) << 5) | (((c >> 16) & 255) >> 3)];
        }
        frames.push(idx);
        delays.push(f === 0 ? 60 : f === FRAMES - 1 ? 250 : perFrame);
        if (f % 4 === 0) { setStatus(`rendering gif ${f + 1}/${FRAMES}`); setProgress((f + 1) / FRAMES * 0.7); await tick(); }
      }
      setStatus('encoding gif'); setProgress(0.85); await tick();
      const bytes = Core.encodeGif(size, size, palette, frames, delays);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes], { type: 'image/gif' }));
      a.download = 'trumpify.gif';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      setStatus(`saved trumpify.gif (${(bytes.length / 1048576).toFixed(1)} MB)`);
    } catch (e) {
      console.error(e);
      setStatus('Could not create the gif.', 'error');
    } finally {
      setProgress(0);
      state.busy = false; refreshButtons();
      draw(el.reverse.checked ? 0 : 1);
      setTimeout(() => { if (!state.busy && /^saved/.test(el.status.textContent)) setStatus(''); }, 6000);
    }
  }

  async function setSourceFromFile(file) {
    try {
      state.srcImg = await fileToImage(file);
      let opt = el.preset.querySelector('[value="__custom"]');
      if (!opt) { opt = new Option('your image', '__custom'); el.preset.add(opt); }
      el.preset.value = '__custom';
      rebuild();
    } catch (e) { setStatus('That file is not an image this browser can open.', 'error'); }
  }

  async function loadTarget() {
    try { localStorage.removeItem(KEY_TARGET); } catch (e) {}
    state.tgtImg = await loadImage(TARGET);
  }

  function saveSettings() { try { localStorage.setItem(KEY_SETTINGS, JSON.stringify(settings)); } catch (e) {} }
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY_SETTINGS) || '{}');
      for (const k of ['detail', 'near', 'dur']) if (typeof saved[k] === 'number') settings[k] = saved[k];
    } catch (e) {}
  }
  function syncControls() {
    el.detail.value = settings.detail; el.near.value = settings.near; el.dur.value = settings.dur;
    $('#o-near').textContent = settings.near;
    $('#o-dur').textContent = `${(+settings.dur).toFixed(1)} s`;
  }
  function bindRange(input, key, needsRebuild) {
    input.addEventListener('input', () => {
      settings[key] = +input.value; syncControls();
    });
    input.addEventListener('change', () => { saveSettings(); if (needsRebuild) scheduleRebuild(); });
  }
  function togglePanel(open) {
    const show = open ?? el.panel.hidden;
    el.panel.hidden = !show;
    el.edit.setAttribute('aria-expanded', String(show));
  }

  el.play.addEventListener('click', play);
  el.gif.addEventListener('click', saveGif);
  el.reverse.addEventListener('change', () => { if (state.ready && !state.busy) { cancelAnim(); draw(el.reverse.checked ? 1 : 0); } });
  el.scrub.addEventListener('input', () => { if (state.ready && !state.busy) { cancelAnim(); draw(+el.scrub.value / 1000); } });
  el.newsrc.addEventListener('click', () => el.srcfile.click());
  el.srcfile.addEventListener('change', () => { if (el.srcfile.files[0]) setSourceFromFile(el.srcfile.files[0]); el.srcfile.value = ''; });
  el.preset.addEventListener('change', async () => {
    if (el.preset.value === '__custom') return;
    state.preset = el.preset.value; state.srcImg = await getPreset(state.preset); rebuild();
  });
  el.edit.addEventListener('click', () => togglePanel());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !el.panel.hidden) { togglePanel(false); el.edit.focus(); }
    else if (e.code === 'Space' && document.activeElement === document.body) { e.preventDefault(); play(); }
  });
  document.addEventListener('pointerdown', (e) => {
    if (!el.panel.hidden && !el.panel.contains(e.target) && !el.edit.contains(e.target)) togglePanel(false);
  });
  bindRange(el.near, 'near', true); bindRange(el.dur, 'dur', false);
  el.detail.addEventListener('change', () => { settings.detail = +el.detail.value; saveSettings(); scheduleRebuild(); });

  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => {
    e.preventDefault();
    const f = [...(e.dataTransfer?.files || [])].find((x) => x.type.startsWith('image/'));
    if (f) setSourceFromFile(f);
  });

  (async function boot() {
    ['wisetree', ...Object.keys(PRESETS)].forEach((n) => el.preset.add(new Option(n, n)));
    loadSettings(); syncControls();
    state.srcImg = await getPreset(state.preset);

    prepareView(settings.detail, sample(state.srcImg, settings.detail)); draw(0);
    await loadTarget();
    setStatus('');
    rebuild();
  })();
})();
</script>
</body>
</html>
